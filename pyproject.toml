[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-coach"
version = "0.1.0"
description = "Generate role-specific interview questions from a resume and job description."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109.0,<2",
  "pydantic>=2.11.0,<3",
  "pypdf>=6.1.0,<7",
  "python-docx>=1.2.0,<2",
  "python-dotenv>=1.1.0,<2",
  "streamlit>=1.50.0,<2",
  "mlx-whisper>=0.4.2,<1; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9",
  "ruff>=0.13.0,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
